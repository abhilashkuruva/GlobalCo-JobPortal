spring.application.name=job-board

# Local development is intentionally self-contained. Production must set the
# prod profile and provide its database, CORS, JWT, and storage environment variables.
spring.profiles.default=dev

# ==============================================================================
# Database Configuration
# JPA / Hibernate Settings
spring.jpa.show-sql=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:change-this-development-only-secret-before-production-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

# Comma-separated browser origins. The prod profile deliberately has no default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Use a persistent Render Disk mount in production, e.g. /var/data/jobboard.
app.storage.root=${APP_STORAGE_ROOT:uploads}

# Health checks expose only liveness/readiness information, never environment values.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Server port (overridable for deployment)
server.port=${PORT:8080}
