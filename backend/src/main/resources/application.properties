spring.application.name=job-board

# Server Port (Render injects PORT environment variable)
server.port=${PORT:8080}

# Database Configuration (Auto-detects PostgreSQL or MySQL based on JDBC URL)
# Neon: use the pooled host (-pooler) for low-latency PgBouncer connections:
# jdbc:postgresql://ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require&prepareThreshold=0
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/job_board_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP sized for Neon pooled connections (avoids exhausting the compute quota)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.initialization-fail-timeout=20000

# JPA / Hibernate Settings (Hibernate automatically resolves dialect from JDBC connection)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Faster JSON responses over the public internet
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,application/javascript,text/css
server.tomcat.threads.max=50
server.tomcat.connection-timeout=10000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:v9y$B&E)H@McQfTjWnZr4u7x!A%C*F-JaNdRgUkXp2s5v8y/B?E(G+KbPeShVmYq}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB