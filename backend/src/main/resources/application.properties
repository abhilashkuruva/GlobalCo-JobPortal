spring.application.name=job-board

# Database Configuration (Defaults to local MySQL, overridable via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_board_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:v9y$B&E)H@McQfTjWnZr4u7x!A%C*F-JaNdRgUkXp2s5v8y/B?E(G+KbPeShVmYq}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB