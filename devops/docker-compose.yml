# ==============================================================================
# GlobalCo JobBoard — Production & Local Development Docker Compose
# ==============================================================================
# Usage:
#   docker-compose -f devops/docker-compose.yml up -d
# ==============================================================================

version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: globalco-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jobboard_db
      MYSQL_USER: jobboard_user
      MYSQL_PASSWORD: jobboard_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: globalco-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      - mysql-db

volumes:
  mysql_data:
    driver: local
